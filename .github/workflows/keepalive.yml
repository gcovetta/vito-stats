# Mantiene despierto el proyecto gratis de Supabase (se pausa tras 7 días sin actividad)
# y evita que GitHub apague este workflow (lo desactiva tras 60 días sin commits).
name: Keepalive Supabase

on:
  schedule:
    - cron: "23 14 * * 1,4"   # lunes y jueves 11:23 (hora Argentina)
  workflow_dispatch:           # botón "Run workflow" para probarlo a mano

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Consultar la base de Supabase
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' config.js)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]+' config.js)
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o resp.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/keepalive" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
            echo "Intento $i → HTTP $CODE: $(cat resp.txt)"
            [ "$CODE" = "200" ] && exit 0
            sleep $((i * 20))
          done
          echo "::error::Supabase no respondió. Puede estar pausado: entrá al dashboard y tocá 'Resume project'."
          exit 1

      - name: Commit de mantenimiento cada ~45 días
        run: |
          LAST=$(git log -1 --format=%ct)
          AGE=$(( ($(date +%s) - LAST) / 86400 ))
          echo "Último commit hace $AGE días"
          if [ "$AGE" -ge 45 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive-stamp
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive-stamp
            git commit -m "keepalive: mantener activo el workflow programado"
            git push
          fi
