# Actualiza solo la tabla, los goleadores y el fixture de La Martona desde la web pública de ADUES.
name: Actualizar desde ADUES

on:
  schedule:
    - cron: "17 16,22 * * 6"   # sábados 13:17 y 19:17 (hora Argentina), después de los partidos
    - cron: "17 13 * * 0,3"    # domingos y miércoles 10:17, por si ADUES carga o reprograma después
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo leer y mostrar (no escribe en la base)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Leer ADUES y actualizar Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node sync-adues.mjs ${{ inputs.prueba && '--dry' || '' }}
